<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trà sữa Táo - AI Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
    .app-container { width: 100%; max-width: 480px; height: 92vh; background: #ffffff; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.1); border: 1px solid #e0e0e0; }
    
    /* Header */
    .chat-header { background: #ffffff; padding: 14px 18px; border-bottom: 2px solid #D32F2F; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-avatar { font-size: 26px; }
    .brand-info h1 { font-size: 1.15rem; color: #D32F2F; font-weight: 700; }
    .status { font-size: 0.75rem; color: #2E7D32; font-weight: 500; }
    .badge-tag { background: #FFEBEE; color: #D32F2F; font-size: 0.72rem; padding: 4px 8px; border-radius: 12px; font-weight: 600; }

    /* Notice banner */
    .simulation-banner { background: #FFF8E1; padding: 8px 12px; font-size: 0.75rem; color: #8D6E63; text-align: center; border-bottom: 1px solid #FFE082; }

    /* Quick Prompts */
    .quick-prompts { display: flex; gap: 6px; padding: 10px; overflow-x: auto; background: #fafafa; border-bottom: 1px solid #eee; }
    .chip { background: #ffffff; border: 1px solid #D32F2F; color: #D32F2F; border-radius: 16px; padding: 6px 12px; font-size: 0.78rem; cursor: pointer; white-space: nowrap; font-weight: 500; }
    .chip:hover { background: #D32F2F; color: #ffffff; }

    /* Chat Messages */
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #fcfcfc; }
    .message { display: flex; max-width: 82%; }
    .bot-message { align-self: flex-start; }
    .user-message { align-self: flex-end; }
    .msg-bubble { padding: 10px 14px; border-radius: 14px; font-size: 0.92rem; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
    .bot-message .msg-bubble { background: #f1f3f5; color: #212529; border-bottom-left-radius: 4px; }
    .user-message .msg-bubble { background: #D32F2F; color: #ffffff; border-bottom-right-radius: 4px; }

    /* Input Footer */
    .chat-footer { padding: 12px; background: #ffffff; border-top: 1px solid #eee; }
    .input-form { display: flex; gap: 8px; }
    .input-form input { flex: 1; padding: 12px 16px; border: 1.5px solid #ddd; border-radius: 24px; outline: none; font-size: 0.9rem; }
    .input-form input:focus { border-color: #D32F2F; }
    .input-form button { background: #D32F2F; color: #ffffff; border: none; padding: 0 18px; border-radius: 24px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
    .input-form button:hover { background: #B71C1C; }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="chat-header">
      <div class="brand">
        <div class="brand-avatar">🍎</div>
        <div class="brand-info">
          <h1>Trà Sữa Táo</h1>
          <p class="status">● Sẵn sàng tư vấn</p>
        </div>
      </div>
      <div class="badge-tag">Demo Sinh Viên</div>
    </header>

    <div class="simulation-banner">
      ⚠️ Dự án sinh viên: Trợ lý AI tư vấn menu và bảng giá mô phỏng.
    </div>

    <!-- Nút gợi ý nhanh -->
    <div class="quick-prompts">
      <button class="chip" onclick="handleQuick('Menu hôm nay có gì?')">📋 Menu hôm nay</button>
      <button class="chip" onclick="handleQuick('Tư vấn món dưới 35.000đ')">💰 Món dưới 35k</button>
      <button class="chip" onclick="handleQuick('Chính sách giao hàng?')">🛵 Giao hàng</button>
      <button class="chip" onclick="handleQuick('Khuyến mãi hiện có?')">🎁 Khuyến mãi</button>
    </div>

    <!-- Hộp tin nhắn -->
    <main class="chat-messages" id="chatBox">
      <div class="message bot-message">
        <div class="msg-bubble">Xin chào bạn! Mình là Trợ lý ảo của <strong>Trà Sữa Táo 🍎</strong>. Mình có thể giúp bạn xem menu, giá món hoặc chính sách giao hàng. Bạn cần tư vấn món nào?</div>
      </div>
    </main>

    <!-- Ô nhập tin -->
    <footer class="chat-footer">
      <form class="input-form" id="chatForm" onsubmit="handleSend(event)">
        <input type="text" id="userInput" placeholder="Nhập câu hỏi tại đây..." autocomplete="off" required />
        <button type="submit" id="btnSubmit">Gửi</button>
      </form>
    </footer>
  </div>

  <script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const btnSubmit = document.getElementById('btnSubmit');
    let conversationHistory = [];

    function addMessage(sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message ' + sender + '-message';
      msgDiv.innerHTML = '<div class="msg-bubble">' + text + '</div>';
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }

    async function handleSend(e) {
      if (e) e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;

      // 1. Hiện tin nhắn người dùng ngay lập tức
      addMessage('user', message);
      userInput.value = '';
      userInput.disabled = true;
      btnSubmit.disabled = true;

      // 2. Hiện trạng thái đang suy nghĩ
      const thinkingElem = addMessage('bot', '🍎 Đang xem menu và suy nghĩ...');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: message,
            history: conversationHistory
          })
        });

        const data = await response.json();
        thinkingElem.remove();

        if (response.ok && data.reply) {
          addMessage('bot', data.reply);
          conversationHistory.push({ role: 'user', text: message });
          conversationHistory.push({ role: 'model', text: data.reply });
        } else {
          addMessage('bot', '⚠️ ' + (data.error || 'Chưa nhận diện được. Hãy kiểm tra lại API Key trên Render!'));
        }
      } catch (err) {
        thinkingElem.remove();
        addMessage('bot', '❌ Lỗi kết nối đến server. Vui lòng kiểm tra lại đường truyền mạng.');
      } finally {
        userInput.disabled = false;
        btnSubmit.disabled = false;
        userInput.focus();
      }
    }

    function handleQuick(promptText) {
      userInput.value = promptText;
      handleSend();
    }
  </script>
</body>
</html>
